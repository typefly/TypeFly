[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["typefly*"]

[project]
name = "typefly"
version = "0.1.0"
description = "An low-response latency LLM-based robot control framework."
authors = [{ name = "Guojun Chen", email = "guojun.chen@yale.edu" }]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "overrides",
    "flask",
    "uvicorn",
    "quart",
    "grpcio-tools",
    "aiohttp",
    "openai",
    "opencv-python",
    "numpy",
    "pillow",
    "djitellopy",
    "filterpy",
    "python-dotenv",
    "ultralytics",
    "torch",
]

[project.scripts]
typefly-run = "typefly.launcher:main"
typefly-serving = "typefly.serving.run:main"
typefly-webui = "typefly.webui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]